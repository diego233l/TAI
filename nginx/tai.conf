# Sitio nginx propio de TAI. Se enlaza una sola vez (ver README):
#   ln -s /opt/apps/tai/nginx/tai.conf /etc/nginx/conf.d/tai.conf
#
# - Escucha en su propio puerto (8082) y no toca ningún otro sitio.
# - Solo /opt/apps/tai/public es accesible desde la web; src/, content/ y .git/ quedan fuera.
# - Los datos (SQLite) están fuera del repositorio: /var/lib/tai (propiedad de www-data).
# - PHP lee el código del repositorio en cada petición (opcache sin espera): tras
#   `git -C /opt/apps/tai pull` el cambio está en producción al instante.

server {
    listen 8082;
    listen [::]:8082;
    server_name _;

    root /opt/apps/tai/public;
    index index.php;
    charset utf-8;

    # Las copias de seguridad importadas pueden ser grandes.
    client_max_body_size 30m;

    server_tokens off;

    # --- Protección opcional con usuario/contraseña ---------------------------------
    # La app es de un solo usuario y no tiene login. Si el puerto es accesible desde
    # Internet, descomenta y crea el fichero con:  htpasswd -c /var/lib/tai/.htpasswd tu_usuario
    #auth_basic           "TAI";
    #auth_basic_user_file /var/lib/tai/.htpasswd;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Recursos estáticos: se revalidan siempre (ETag/Last-Modified) para que un
    # `git pull` se vea al recargar, sin pasos de build ni versiones manuales.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff";
    }

    # Todo lo demás (la SPA y /api/*) lo atiende el front controller.
    location / {
        try_files /nonexistent @php;
    }

    location @php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param SCRIPT_NAME     /index.php;
        fastcgi_param REQUEST_URI     $request_uri;

        # Ruta de datos (fuera del repositorio).
        fastcgi_param TAI_DATA_DIR /var/lib/tai;

        # Aislamiento de PHP y lectura del código sin caché de espera.
        fastcgi_param PHP_ADMIN_VALUE "open_basedir=/opt/apps/tai:/var/lib/tai:/tmp\nopcache.revalidate_freq=0\nopcache.validate_timestamps=1\nexpose_php=0";

        # Ajusta el socket a tu versión de PHP (ls /run/php/). Ubuntu 24.04: php8.3-fpm.sock
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_read_timeout 60s;
    }

    # Nunca servir ficheros ocultos ni código fuente.
    location ~ /\.(?!well-known) { deny all; }
    location ~* \.(php|phtml|inc|sqlite|db|md|txt|json)$ {
        # Los .php directos no se ejecutan (solo el front controller, vía @php).
        return 404;
    }
}
